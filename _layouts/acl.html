<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "26-27赛季五大联赛ACL伤病统计" | escape }}</title>
  <link rel="stylesheet" href="assets/acl/site.css">
</head>
<body>
  <main>
    <div class="tools" hidden>
      <input type="search" aria-label="搜索球员或球队" placeholder="搜索球员或球队">
      <select aria-label="按联赛筛选"><option value="">全部联赛</option></select>
      <output aria-live="polite"></output>
    </div>
    {{ content }}
    <p id="empty" hidden>没有匹配的记录。可以换个关键词，或选择全部联赛。</p>
    <p class="portrait-credit">球员头像来自 <a href="https://www.fmscout.com/player/91207274/amadou-onana.html">FM Scout · Scope Faces</a></p>
  </main>
  <dialog id="record" aria-labelledby="record-name">
    <header><strong>球员伤病记录</strong><button type="button" aria-label="关闭伤病记录">×</button></header>
    <article>
      <div class="profile"><img class="portrait" alt=""><div><h2 id="record-name"></h2><div id="english"></div></div></div>
      <div class="facts"><div class="meta"></div><p></p></div>
      <section><h3>受伤经过</h3><p id="event"></p></section>
      <section><h3>具体伤情</h3><p id="injury"></p><small id="attribution"></small></section>
      <section><h3>公告与报道</h3><div id="sources"></div></section>
    </article>
  </dialog>
  <div id="season-data" hidden
    data-players="{{ site.data.players | jsonify | escape }}"
    data-badges="{{ site.data.badges | jsonify | escape }}"
    data-notes="{{ site.data.injury_notes | jsonify | escape }}"></div>
  <script src="assets/acl/site.js"></script>
</body>
</html>
