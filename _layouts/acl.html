<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "26-27赛季五大联赛ACL伤病统计" | escape }}</title>
  <style>
    :root { color-scheme: light; --ink: #16332d; --green: #09614c; --line: #cddad3; --muted: #4d635b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fafbf8; color: var(--ink); font: 16px/1.6 "Source Sans 3", "Microsoft YaHei", system-ui, sans-serif; }
    main { width: min(96%, 110rem); margin: clamp(20px, 3vw, 52px) auto; }
    h1 { margin: 0 0 1.4rem; border-top: 5px solid var(--ink); padding-top: 1rem; font-size: clamp(1.7rem, 3.3vw, 3.5rem); line-height: 1.2; text-wrap: balance; }
    .tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 0 0 16px; }
    .tools[hidden], [hidden] { display: none !important; }
    input, select { font: inherit; color: var(--ink); background: white; border: 1px solid #879b90; border-radius: 4px; padding: 8px 12px; min-height: 44px; }
    input { width: min(18rem, 100%); }
    input::placeholder { color: var(--muted); }
    output { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    .scroll { overflow: auto; max-height: 76vh; scrollbar-color: #81998e #edf1eb; }
    table { width: 100%; border-spacing: 0; background: white; font-size: .95rem; }
    th, td { padding: .74rem .68rem; text-align: left; }
    th { position: sticky; top: 0; background: var(--ink); color: #fff; white-space: nowrap; font-size: .85rem; font-weight: 600; }
    td { border-bottom: 1px solid var(--line); }
    td:nth-child(1) { font-variant-numeric: tabular-nums; color: var(--muted); }
    td:nth-child(2) { font-weight: 700; }
    td:nth-child(3) { color: var(--muted); }
    td:is(:nth-child(1), :nth-child(4), :nth-child(6), :last-child) { white-space: nowrap; }
    td:nth-last-child(2), td:nth-last-child(3) { min-width: 10em; }
    tbody tr:focus-within, tbody tr:hover { background: #f1f6f0; }
    a { color: var(--green); text-underline-offset: .24em; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: 3px solid #19785f; outline-offset: 2px; }
    .identity { display: inline-flex; align-items: center; gap: .45rem; vertical-align: middle; }
    .identity img { width: 24px; height: 26px; object-fit: contain; flex: none; }
    .identity .portrait { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .birthday { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .age { color: var(--muted); }
    @media (min-width: 761px) { .age { display: block; font-size: .86rem; } }
    ::selection { background: #c6e9d4; }
    @media (max-width: 760px) {
      main { width: auto; margin: 16px; }
      .tools { gap: 8px; }
      input { flex: 1 1 100%; }
      .scroll { max-height: none; overflow: visible; }
      table, tbody { display: block; }
      thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      tbody tr { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; padding: 16px 4px; border-top: 1px solid var(--line); }
      td { padding: 0; border: 0; }
      td:nth-child(1) { grid-area: 1 / 2; font-size: .83rem; }
      td:nth-child(2) { grid-area: 1 / 1; font-size: 1.08rem; }
      td:nth-child(3) { grid-column: 1 / -1; font-size: .92rem; }
      td:nth-child(n+4) { grid-column: 1 / -1; min-width: 0; }
      td:nth-child(n+4):not(:last-child) { display: grid; grid-template-columns: 4.7em 1fr; }
      td[data-label]::before { content: attr(data-label); color: var(--muted); font-size: .88rem; }
      td:last-child a { display: inline-flex; align-items: center; min-height: 44px; }
    }
  </style>
</head>

  <script>
    const table = document.querySelector("main table");
    if (table && table.tBodies.length && table.tHead) {
      const tools = document.querySelector(".tools");
      const search = tools.querySelector("input");
      const league = tools.querySelector("select");
      const count = tools.querySelector("output");
      const rows = Array.from(table.tBodies[0].rows);
      const media = JSON.parse(document.getElementById("season-media").textContent);
      function addImage(cell, src, portrait = false) {
        if (!src) return;
        const identity = document.createElement("span");
        identity.className = "identity";
        const image = new Image();
        image.src = src;
        image.alt = "";
        if (portrait) image.className = "portrait";
        identity.append(image, document.createTextNode(cell.textContent.trim()));
        cell.replaceChildren(identity);
      }
      function ageOnDate(birthday, injuryDate) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(injuryDate) || injuryDate < birthday) return null;
        return Number(injuryDate.slice(0, 4)) - Number(birthday.slice(0, 4))
          - Number(injuryDate.slice(5) < birthday.slice(5));
      }
      const birthdayHeading = document.createElement("th");
      birthdayHeading.scope = "col";
      birthdayHeading.textContent = "生日（受伤时年龄）";
      table.tHead.rows[0].cells[6].before(birthdayHeading);
      for (const row of rows) {
        const cells = row.cells;
        const player = media.players[cells[2].textContent.trim()];
        addImage(cells[1], player?.portrait, true);
        addImage(cells[4], media.clubs[cells[4].textContent.trim()]);
        addImage(cells[5], media.leagues[cells[5].textContent.trim()]);
        const birthday = row.insertCell(6);
        birthday.className = "birthday";
        birthday.textContent = player?.birthday ?? "—";
        if (player) {
          const years = ageOnDate(player.birthday, cells[0].textContent.trim());
          if (years !== null) {
            const age = document.createElement("span");
            age.className = "age";
            age.textContent = "（" + years + "岁）";
            const value = document.createElement("span");
            value.append(player.birthday, age);
            birthday.replaceChildren(value);
          }
        }
      }
      const headings = Array.from(table.tHead.rows[0].cells, cell => cell.textContent.trim());
      const leagues = new Set();
      for (const row of rows) {
        Array.from(row.cells).slice(3, 9).forEach((cell, i) => cell.dataset.label = i === 3 ? "生日（年龄）" : headings[i + 3]);
        leagues.add(row.cells[5].textContent.trim());
      }
      for (const name of leagues) league.add(new Option(name, name));
      const scroll = document.createElement("div");
      scroll.className = "scroll";
      scroll.tabIndex = 0;
      scroll.setAttribute("role", "region");
      scroll.setAttribute("aria-label", "球员伤病名单");
      table.before(tools, scroll);
      scroll.append(table);
      function filter() {
        const query = search.value.trim().toLocaleLowerCase();
        let visible = 0;
        for (const row of rows) {
          const matchesName = [1, 2, 4].some(i => row.cells[i].textContent.toLocaleLowerCase().includes(query));
          row.hidden = !matchesName || (league.value !== "" && row.cells[5].textContent.trim() !== league.value);
          if (!row.hidden) visible++;
        }
        count.textContent = visible === rows.length ? "共 " + visible + " 条记录" : visible + " / " + rows.length + " 条记录";
        document.getElementById("empty").hidden = visible > 0;
        scroll.scrollTop = 0;
      }
      search.addEventListener("input", filter);
      league.addEventListener("change", filter);
      filter();
      tools.hidden = false;
    }
  </script>
