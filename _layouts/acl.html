<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>26-27赛季五大联赛ACL伤病统计</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #20252b; font: 16px/1.55 system-ui, sans-serif; }
    main { margin: 2rem auto; width: 96%; max-width: 1680px; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.5rem, 3vw, 2.4rem); }
    .sheet { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .65rem .8rem; border: 1px solid #d3dae1; text-align: left; }
    th { background: #edf1f5; }
    tbody tr:nth-child(even) { background: #f7f8fa; }
    th, td { white-space: nowrap; }
    td:nth-child(7), td:nth-child(8) { white-space: normal; min-width: 12em; }
    a { color: #185abc; }
  </style>
</head>
<body>
  <main><div class="sheet">{{ content }}</div></main>
</body>
</html>
