<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "26-27赛季五大联赛ACL伤病统计" | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/acl/site.css' | relative_url }}">
</head>
<body>
  <main>
    <div class="season-heading"><details class="season-picker">
      <summary>{{ page.season | escape }} 赛季</summary>
      <span class="season-links">
        <a href="{{ '/' | relative_url }}"{% unless page.historical %} aria-current="page"{% endunless %}>2026–27 赛季</a>
        <a href="{{ '/2025-26/' | relative_url }}"{% if page.historical %} aria-current="page"{% endif %}>2025–26 赛季</a>
      </span>
    </details><h1>五大联赛 ACL 伤病统计</h1></div>
    <div class="tools" hidden>
      <input type="search" aria-label="搜索球员或球队" placeholder="搜索球员或球队">
      <select aria-label="按联赛筛选"><option value="">全部联赛</option></select>
      <output aria-live="polite"></output>
    </div>
    {{ content }}
    <p id="empty" hidden>没有匹配的记录。可以换个关键词，或选择全部联赛。</p>
    <p class="portrait-credit">球员头像来自 <a href="https://www.fmscout.com/player/91207274/amadou-onana.html">FM Scout · Scope Faces</a></p>
  </main>
  <dialog id="record" aria-labelledby="record-name">
    <header><strong>球员伤病记录</strong><button type="button" aria-label="关闭伤病记录">×</button></header>
    <article>
      <div class="record-top">
        <div class="record-bio">
          <div class="profile"><img class="portrait" alt=""><div><h2 id="record-name"></h2><div id="english"></div></div></div>
      <div class="facts"><div class="meta"></div><p></p></div>
      </div>
        <figure class="fm-figure" hidden>
          <figcaption>FM27 位置 <span title="进攻方向朝上">↑</span></figcaption>
          <svg class="fm-pitch" viewBox="0 0 120 160" role="img">
            <rect width="120" height="160" rx="5" fill="#326947"/>
            <g fill="none" stroke="#b6d7bb" stroke-width="1">
              <rect x="5" y="5" width="110" height="150"/>
              <path d="M5 80h110 M32 5v22h56V5 M46 5v9h28V5 M32 155v-22h56v22 M46 155v-9h28v9"/>
              <circle cx="60" cy="80" r="14"/>
            </g>
            <g class="fm-markers"></g>
          </svg>
        </figure>
      </div>
      <section><h3>受伤经过</h3><p id="event"></p></section>
      <section><h3>具体伤情</h3><p id="injury"></p><small id="attribution"></small></section>
      <section><h3>公告与报道</h3><div id="sources"></div></section>
    </article>
  </dialog>
  <div id="season-data" hidden
    data-asset-base="{{ '/' | relative_url }}"
    {% if page.historical %}data-history-badges="{{ site.data.badges_2025_26 | jsonify | escape }}"{% endif %}
    data-history="{{ site.data.season_2025_26 | jsonify | escape }}"
    data-positions="{{ site.data.fm27_positions | jsonify | escape }}"
    data-players="{{ site.data.players | jsonify | escape }}"
    data-badges="{{ site.data.badges | jsonify | escape }}"
    data-notes="{{ site.data.injury_notes | jsonify | escape }}"></div>
  <script src="{{ '/assets/acl/site.js' | relative_url }}"></script>
</body>
</html>
